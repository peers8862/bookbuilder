[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bookbuilder"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=5.4.1",
  "anthropic>=0.25.0",
  "openai>=1.0.0",
  "httpx[http2]>=0.27.0",
  "numpy>=1.26.0",
  "hdbscan>=0.8.33",
  "readability-lxml>=0.8.1",
  "python-docx>=1.1.0",
  "mcp[cli]>=1.0.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "mypy"]

[project.scripts]
bookbuilder = "bookbuilder.cli:main"

[tool.black]
line-length = 88

[tool.ruff]
actions = []

[tool.mypy]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["bookbuilder*"]
